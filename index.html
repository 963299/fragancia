<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00f3ff">
  <title>Fragancia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --panel: #0d111a;
      --border: #1b263b;
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-magenta: #ff0055;
      --neon-yellow: #ffee00;
      --text: #e2e8f0;
      --dim: #64748b;
      --font-head: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    header {
      background: var(--panel);
      border-bottom: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--neon-cyan);
      border-radius: 8px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .brand h1 {
      font-family: var(--font-head);
      font-size: 20px;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    .status-tag {
      font-family: var(--font-head);
      font-size: 11px;
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0, 255, 102, 0.3);
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      overflow-x: auto;
      background: rgba(13, 17, 26, 0.8);
      border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--font-head);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--neon-green);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
    }

    .card-title {
      font-family: var(--font-head);
      color: var(--neon-green);
      font-size: 16px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 5px var(--neon-green);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--dim);
      text-transform: uppercase;
      font-family: var(--font-head);
    }

    input, select {
      background: #05070a;
      border: 1px solid var(--neon-green);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .stat-box {
      background: #05070b;
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 12px;
    }

    .stat-box label { color: var(--dim); font-size: 10px; }
    .stat-box .val {
      font-family: var(--font-head);
      font-size: 20px;
      color: var(--neon-cyan);
      text-shadow: 0 0 6px var(--neon-cyan);
    }

    .bar-container {
      height: 16px;
      background: #05070a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      border: 1px solid var(--border);
      margin: 15px 0;
    }

    .bar-segment {
      height: 100%;
      transition: width 0.3s;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="2">
          <path d="M12 2v6m0 0a4 4 0 0 1 4 4v8a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-8a4 4 0 0 1 4-4z"/>
        </svg>
      </div>
      <h1>Fragancia</h1>
    </div>
    <div class="status-tag">PWA ATIVO</div>
  </header>

  <nav id="topNav">
    <button class="nav-btn active" onclick="switchTab('montar')">MONTAR</button>
    <button class="nav-btn" onclick="switchTab('formulas')">FÓRMULAS</button>
    <button class="nav-btn" onclick="switchTab('fabricar')">FABRICAR</button>
    <button class="nav-btn" onclick="switchTab('lotes')">LOTES</button>
    <button class="nav-btn" onclick="switchTab('ingredientes')">INGREDIENTES</button>
    <button class="nav-btn" onclick="switchTab('perfume')">PERFUME</button>
    <button class="nav-btn" onclick="switchTab('olfativos')">OLFATIVOS</button>
  </nav>

  <div class="container" id="mainContent">
    <div class="card">
      <div class="card-title">Fórmula em Construção</div>
      
      <div class="form-grid">
        <div class="field" style="grid-column: span 2;">
          <label>Nome do Perfume / Acorde</label>
          <input type="text" value="Polo Blue Elixir" id="formulaName">
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="category">
            <option>Perfume (EDP)</option>
            <option>Home Spray</option>
            <option>Vela Aromática</option>
            <option>Difusor de Varetas</option>
          </select>
        </div>
        <div class="field">
          <label>Volume Total (ml/g)</label>
          <input type="number" value="100" id="totalVol" onchange="recalc()">
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <label>SOMA ATUAL</label>
        <div class="val" id="volVal">100.0 ml/g</div>
      </div>
      <div class="stat-box">
        <label>ITENS</label>
        <div class="val" style="color: var(--neon-green);" id="itemsVal">4</div>
      </div>
      <div class="stat-box">
        <label>CUSTO ESTIMADO</label>
        <div class="val" style="color: var(--neon-magenta);" id="costVal">R$ 42,50</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Composição da Fórmula</div>

      <div class="bar-container" id="compBar">
        <div class="bar-segment" style="width: 20%; background: var(--neon-yellow);" title="Essência"></div>
        <div class="bar-segment" style="width: 70%; background: var(--neon-cyan);" title="Álcool 96%"></div>
        <div class="bar-segment" style="width: 5%; background: var(--neon-magenta);" title="Fixador"></div>
        <div class="bar-segment" style="width: 5%; background: var(--neon-green);" title="Água Destilada"></div>
      </div>

      <div class="legend" id="legendBox">
        <div class="legend-item"><div class="dot" style="background: var(--neon-yellow);"></div> Essência Polo Blue (20%)</div>
        <div class="legend-item"><div class="dot" style="background: var(--neon-cyan);"></div> Álcool de Cereais (70%)</div>
        <div class="legend-item"><div class="dot" style="background: var(--neon-magenta);"></div> Ambroxan / Fixador (5%)</div>
        <div class="legend-item"><div class="dot" style="background: var(--neon-green);"></div> Água Destilada (5%)</div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    function recalc() {
      const vol = document.getElementById('totalVol').value || 100;
      document.getElementById('volVal').innerText = `${parseFloat(vol).toFixed(1)} ml/g`;
    }

    function switchTab(tabName) {
      const btns = document.querySelectorAll('.nav-btn');
      btns.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
